php-version = "8.5"

[source]
paths = ["src", "tests"]
includes = ["vendor"]

# CS-1: 4 spaces and a soft line length of 120 characters.
[formatter]
print-width = 120
tab-width = 4
use-tabs = false
sort-uses = "preserve"
separate-use-types = true
expand-use-groups = true

# CS-1 §1: every file declares strict types.
[linter.rules.strict-types]
enabled = true
level = "error"
allow-disabling = false

# CS-1 §5: root-level functions, classes, and constants are imported with a use statement, never used unqualified or
# written fully qualified.
[linter.rules.ambiguous-function-call]
enabled = true
level = "error"

[linter.rules.ambiguous-constant-access]
enabled = true
level = "error"

[linter.rules.no-fully-qualified-global-constant]
enabled = true
level = "error"

[linter.rules.no-fully-qualified-global-function]
enabled = true
level = "error"

[linter.rules.no-fully-qualified-global-class-like]
enabled = true
level = "error"

# CS-1 §1 and CS-2 §1: StudlyCaps class-likes and enum cases without Interface, Trait, or Abstract affixes, SNAKE_CASE
# constants, and camelCase methods, properties, and variables.
[linter.rules.class-name]
enabled = true
level = "error"
psr = false

[linter.rules.interface-name]
enabled = true
level = "error"
psr = false

[linter.rules.trait-name]
enabled = true
level = "error"
psr = false

[linter.rules.enum-name]
enabled = true
level = "error"

[linter.rules.constant-name]
enabled = true
level = "error"

[linter.rules.function-name]
enabled = true
level = "error"
camel = true
either = false

[linter.rules.method-name]
enabled = true
level = "error"
camel = true
either = false
# Test methods are snake_case under a #[Test] attribute, which this rule does not recognise: it only treats methods named
# test* as tests. Their names are left to review. src/Testing ships the store contract tests for driver packages.
exclude = ["tests/", "src/Testing/"]

[linter.rules.property-name]
enabled = true
level = "error"
camel = true
either = false

[linter.rules.variable-name]
enabled = true
level = "error"
camel = true
either = false
check-parameters = true

# CS-3 §2: tests are marked with the #[Test] attribute rather than a test prefix.
[linter.rules.prefer-test-attribute]
enabled = true
level = "error"

# CS-1 §17: closures and arrow functions that do not use $this are static.
[linter.rules.prefer-static-closure]
enabled = true
level = "error"

[linter.rules.too-many-methods]
enabled = false

[linter.rules.excessive-parameter-list]
enabled = false

[linter.rules.cyclomatic-complexity]
enabled = false

[linter.rules.kan-defect]
enabled = false

[linter.rules.too-many-properties]
enabled = false

# The package depends on the PSR-20 clock interface beyond PHP; add a dependency here when the package requires one.
# Tests may use anything.
[[guard.perimeter.rules]]
namespace = "Dirthara\\Session\\"
permit = ["@native", "Dirthara\\Session\\**", "Psr\\Clock\\**"]

# The store contract tests that driver packages extend are PHPUnit test cases.
[[guard.perimeter.rules]]
namespace = "Dirthara\\Session\\Testing\\"
permit = ["@native", "Dirthara\\Session\\**", "PHPUnit\\**"]

[[guard.perimeter.rules]]
namespace = "Dirthara\\Session\\Tests\\"
permit = ["@all"]

# CS-1 §15: classes are final, except the store contract tests that driver packages extend.
[[guard.structural.rules]]
on = "Dirthara\\Session\\**"
not-on = "Dirthara\\Session\\Testing\\**"
target = "class"
must-be-final = true
reason = "Classes are final (CS-1 §15)."

[[guard.structural.rules]]
on = "Dirthara\\Session\\Contract\\**"
must-be = ["interface"]
reason = "The Contract namespace holds only interfaces."

# CS-7: every exception implements the package interface and carries its context through the shared trait.
[[guard.structural.rules]]
on = "Dirthara\\Session\\Exception\\**"
target = "class"
must-be-named = "*Exception"
must-implement = "Dirthara\\Session\\Exception\\SessionException"
must-use-trait = "Dirthara\\Session\\Exception\\HasExceptionContext"
reason = "Package exceptions implement SessionException and use HasExceptionContext (CS-7)."

# CS-3: test classes are suffixed with Test. Store tests extend the shipped store contract tests, which extend TestCase.
[[guard.structural.rules]]
on = "Dirthara\\Session\\Tests\\**"
not-on = "Dirthara\\Session\\Tests\\{Fixtures\\**,Driver\\Memory\\MemorySessionStoreTest}"
target = "class"
must-be-named = "*Test"
must-extend = "PHPUnit\\Framework\\TestCase"
reason = "Test classes are PHPUnit test cases suffixed with Test (CS-3)."

[[guard.structural.rules]]
on = "Dirthara\\Session\\Tests\\Driver\\Memory\\MemorySessionStoreTest"
target = "class"
must-extend = "Dirthara\\Session\\Testing\\SessionStoreTestCase"
reason = "The memory store is tested against the store contract that every driver is tested against."
